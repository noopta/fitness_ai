name: Mobile CI/CD

on:
  push:
    branches:
      - dev
      - main
      # Older store runtimes (e.g. backport/3.1.0-*) — main's JS can't run on
      # those binaries, so their OTAs publish from their own branch.
      - 'backport/**'
    paths:
      - 'mobileAlt/**'
      # Bundled into the app as source (Metro): a change there is an app change.
      - 'packages/agent-ui-core/**'
      - 'packages/diagnostic-core/**'
      - 'packages/personal-training-core/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      build_production:
        description: 'Trigger full production build + TestFlight submit'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ── Dev branch: instant OTA update ────────────────────────────────────────
  ota-dev:
    name: OTA Update → dev channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobileAlt/package-lock.json
      - name: Install dependencies
        working-directory: mobileAlt
        run: npm ci
      - name: Native dependency guard
        working-directory: mobileAlt
        # Fails when a native dependency changed without a runtimeVersion bump:
        # the OTA would reach binaries that don't contain it (scripts/check-native-deps.js).
        run: node scripts/check-native-deps.js
      - name: Push OTA → dev
        working-directory: mobileAlt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          # Through env, first line only: a commit message with quotes in it
          # broke the shell command when interpolated inline (7 Oct).
          MSG: ${{ github.event.head_commit.message }}
        run: |
          npx eas-cli update --branch dev --message "$(printf '%s' "$MSG" | head -n1)" --non-interactive

  # ── Main branch: OTA to production channel (instant, no build needed) ─────
  ota-production:
    name: OTA Update → production channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event.inputs.build_production != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobileAlt/package-lock.json
      - name: Install dependencies
        working-directory: mobileAlt
        run: npm ci
      - name: Native dependency guard
        working-directory: mobileAlt
        # Fails when a native dependency changed without a runtimeVersion bump:
        # the OTA would reach binaries that don't contain it (scripts/check-native-deps.js).
        run: node scripts/check-native-deps.js
      - name: Push OTA → production
        working-directory: mobileAlt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          # Through env, first line only: a commit message with quotes in it
          # broke the shell command when interpolated inline (7 Oct).
          MSG: ${{ github.event.head_commit.message }}
          # EAS Update code signing (Oct 2026 audit). When the private key
          # secret is present the update is signed; binaries built with the
          # matching certificate in app.json refuse unsigned/foreign updates.
          EXPO_UPDATES_PRIVATE_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}
        run: |
          SIGN=""
          if [ -n "$EXPO_UPDATES_PRIVATE_KEY" ]; then
            mkdir -p "$RUNNER_TEMP/eas-keys"
            printf '%s' "$EXPO_UPDATES_PRIVATE_KEY" > "$RUNNER_TEMP/eas-keys/private-key.pem"
            SIGN="--private-key-path $RUNNER_TEMP/eas-keys/private-key.pem"
          else
            # No key secret yet: publish unsigned (as before) rather than fail.
            # Binaries built with the certificate will ignore unsigned updates,
            # so add EXPO_UPDATES_PRIVATE_KEY before shipping such a build.
            node -e "const f='app.json',j=require('./'+f);delete j.expo.updates.codeSigningCertificate;delete j.expo.updates.codeSigningMetadata;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          fi
          npx eas-cli update --branch production --message "$(printf '%s' "$MSG" | head -n1)" --non-interactive $SIGN

  # ── Backport branches: OTA for an older store runtime ─────────────────────
  # The runtime comes from the branch's own app.json, so a 3.1.0 backport only
  # reaches 3.1.0 binaries. iOS only — Android backports are published by hand
  # when wanted. Bundling here (not on the EC2 box, which also serves prod and
  # thrashes on Metro's ~1.8 GB peak) is the point of this job.
  ota-backport:
    name: OTA Update → production (backport runtime, iOS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/heads/backport/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobileAlt/package-lock.json
      - name: Install dependencies
        working-directory: mobileAlt
        run: npm ci
      - name: Native dependency guard
        working-directory: mobileAlt
        # Fails when a native dependency changed without a runtimeVersion bump:
        # the OTA would reach binaries that don't contain it (scripts/check-native-deps.js).
        run: node scripts/check-native-deps.js
      - name: Push OTA → production (iOS)
        working-directory: mobileAlt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          MSG: ${{ github.event.head_commit.message }}
          EXPO_UPDATES_PRIVATE_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}
        run: |
          SIGN=""
          if [ -n "$EXPO_UPDATES_PRIVATE_KEY" ]; then
            mkdir -p "$RUNNER_TEMP/eas-keys"
            printf '%s' "$EXPO_UPDATES_PRIVATE_KEY" > "$RUNNER_TEMP/eas-keys/private-key.pem"
            SIGN="--private-key-path $RUNNER_TEMP/eas-keys/private-key.pem"
          else
            # No key secret yet: publish unsigned (as before) rather than fail.
            # Binaries built with the certificate will ignore unsigned updates,
            # so add EXPO_UPDATES_PRIVATE_KEY before shipping such a build.
            node -e "const f='app.json',j=require('./'+f);delete j.expo.updates.codeSigningCertificate;delete j.expo.updates.codeSigningMetadata;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          fi
          npx eas-cli update --branch production --platform ios --message "$(printf '%s' "$MSG" | head -n1)" --non-interactive $SIGN

  # ── Manual trigger only: full build + TestFlight submit ───────────────────
  build-and-submit:
    name: Build & Submit → TestFlight
    runs-on: ubuntu-latest
    if: github.event.inputs.build_production == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobileAlt/package-lock.json
      - name: Install dependencies
        working-directory: mobileAlt
        run: npm ci
      - name: Build iOS production
        working-directory: mobileAlt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform ios --profile production --non-interactive --wait
      - name: Submit to TestFlight
        working-directory: mobileAlt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli submit --platform ios --latest --non-interactive
